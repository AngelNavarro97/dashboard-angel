<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
</head>
<body>
<title>Encuesta Método SAS · Español</title>
<style>
/* Layout: single-column mobile-first survey; Método SAS identity — indigo brand header, white body */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1d1b3a; --muted:#6f6c8a; --line:#e6e5ef;
  --brand:#29265b; --brand2:#3d3a7d; --accent:#5b56a8; --accent-soft:#edecf5; --coral:#d2553f; --gold:#e0a93b;
  --good:#3aa676; --ring:rgba(91,86,168,.35); --shadow:0 10px 30px rgba(41,38,91,.10);
  --dfont:'Fraunces',Georgia,serif; --bfont:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14131f; --surface:#1e1c33; --ink:#eceaf6; --muted:#a5a2c4; --line:#322e52;
  --brand:#b9b5ff; --brand2:#8f8ae0; --accent:#8b86d8; --accent-soft:#26224a; --coral:#f0876a; --gold:#e6bd63;
  --good:#4cc78d; --ring:rgba(139,134,216,.42); --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14131f; --surface:#1e1c33; --ink:#eceaf6; --muted:#a5a2c4; --line:#322e52;
  --brand:#b9b5ff; --brand2:#8f8ae0; --accent:#8b86d8; --accent-soft:#26224a; --coral:#f0876a; --gold:#e6bd63;
  --good:#4cc78d; --ring:rgba(139,134,216,.42); --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--bfont);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-block:24px 60px;padding-left:16px;padding-right:16px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);border-radius:18px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.applogo{height:38px;width:auto;flex:none}
.langtag{color:#e6e5f5;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px}
.eyebrow{color:var(--accent);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{font-family:var(--dfont);font-weight:600;font-size:clamp(24px,6vw,32px);line-height:1.1;margin:0 0 10px;text-wrap:balance;color:var(--brand)}
.hero p{margin:0;color:var(--muted);font-size:15px}
.hero .meta{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:18px 0 8px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--brand));transition:width .35s ease}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.q .num{font-family:var(--dfont);font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.3px}
.q h3{margin:2px 0 4px;font-size:17px;font-weight:700;line-height:1.3;text-wrap:balance}
.q .opt-req{color:var(--muted);font-weight:600;font-size:12px}
.scale{display:flex;gap:8px;margin-top:14px}
.scale button{flex:1;aspect-ratio:1/1;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;cursor:pointer;font-size:26px;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.scale button:hover{transform:translateY(-2px);border-color:var(--accent)}
.scale button.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px);box-shadow:0 0 0 3px var(--ring)}
.scale-lbl{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:14px}
.nps button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;padding:10px 0;transition:transform .12s ease,border-color .12s ease}
.nps button:hover{border-color:var(--accent);transform:translateY(-2px)}
.nps button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.nps.det button.on{background:var(--coral);border-color:var(--coral)}
.nps.pas button.on{background:var(--gold);border-color:var(--gold);color:#3a2c07}
.nps.pro button.on{background:var(--good);border-color:var(--good)}
@media(max-width:430px){.nps{grid-template-columns:repeat(6,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;padding:9px 15px;color:var(--ink);transition:border-color .12s ease,background .12s ease}
.chips button:hover{border-color:var(--accent)}
.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
textarea,input[type=text]{width:100%;margin-top:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-family:var(--bfont);font-size:15px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
textarea{min-height:88px}
.submit{width:100%;border:none;background:var(--brand);color:#fff;font-family:var(--bfont);font-weight:800;font-size:16px;padding:16px;border-radius:14px;cursor:pointer;margin-top:6px;box-shadow:var(--shadow);transition:filter .15s ease,transform .12s ease}
.submit:hover{filter:brightness(1.12);transform:translateY(-1px)}
.submit:disabled{opacity:.6;cursor:default}
.err{color:var(--coral);font-weight:700;font-size:13.5px;text-align:center;margin-top:12px;min-height:18px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.thanks{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:40px 24px;box-shadow:var(--shadow);text-align:center}
.thanks .check{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:38px}
.thanks h2{font-family:var(--dfont);font-weight:600;color:var(--brand);font-size:27px;margin:0 0 10px}
.thanks p{color:var(--muted);margin:0 auto;max-width:44ch;font-size:15px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const T = {"brand": "Método SAS", "htmltitle": "Encuesta Método SAS · Español", "welcome": "¡Bienvenido/a! 👋", "title": "¿Cómo ha sido tu experiencia con el Método SAS?", "intro": "Nos encantaría conocer tu opinión sobre el Método SAS. Dedicar un minuto a esta encuesta nos ayuda muchísimo a seguir mejorándolo. ¡Gracias de corazón por tu ayuda!", "meta": "⏱ Menos de 1 minuto · 6 preguntas", "q1": "En general, ¿cómo de satisfecho/a estás con el Método SAS?", "q1lo": "Nada satisfecho/a", "q1hi": "Muy satisfecho/a", "q2": "¿Qué probabilidad hay de que recomiendes el Método SAS a un colega?", "q2lo": "Nada probable", "q2hi": "Muy probable", "q3": "¿Cómo valoras las sesiones de mentoría y formación del Método SAS?", "q3lo": "Muy flojas", "q3hi": "Excelentes", "q4": "¿Cómo valoras la rapidez y la atención del equipo del Método SAS?", "q4lo": "Muy lenta", "q4hi": "Inmejorable", "q5": "¿Qué es lo que más valoras del Método SAS?", "q5opt": "Opcional · elige las que quieras", "q5opts": ["Mentoría", "Formación", "Materiales", "Atención al cliente", "Resultados clínicos", "Comunidad"], "q6": "¿Hay algo que podamos mejorar en el Método SAS?", "q6opt": "Opcional", "q6ph": "Cuéntanos lo que quieras…", "qname": "¿Cómo te llamas?", "qnameopt": "Opcional · así sabemos que eres tú", "qnameph": "Tu nombre", "submit": "Enviar mis respuestas", "reqmsg": "Por favor, responde las preguntas 1 a 4 (⭐).", "sending": "Enviando…", "thankTitle": "¡Gracias de corazón! 🙌", "thankText": "Hemos recibido tus respuestas. Nos ayudan muchísimo a seguir mejorando el Método SAS. ¡Un abrazo del equipo!"};
const FACES=["😞","😕","😐","🙂","😍"];
const state={q1:null,q2:null,q3:null,q4:null,q5:[],q6:"",name:""};

const sessionId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(String(Date.now())+Math.random().toString(16).slice(2));
let maxReached=0, completed=false, abandonSent=false;
function endpointReady(){ return /^https?:\/\//.test(ENDPOINT); }
function post(payload){
  if(!endpointReady())return;
  payload.lang=LANG; payload.sessionId=sessionId;
  try{ fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload),keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"}}); }catch(e){}
}
function beacon(payload){
  if(!endpointReady())return;
  payload.lang=LANG; payload.sessionId=sessionId;
  try{
    if(navigator.sendBeacon){ navigator.sendBeacon(ENDPOINT, new Blob([JSON.stringify(payload)],{type:"text/plain;charset=utf-8"})); }
    else post(payload);
  }catch(e){ post(payload); }
}
function reach(n){ if(n>maxReached)maxReached=n; }

function buildScale(elId,key,qn){
  const el=document.getElementById(elId); el.innerHTML="";
  FACES.forEach((f,i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=f; b.setAttribute("aria-label",(i+1)+" / 5");
    if(state[key]===i+1)b.classList.add("on");
    b.onclick=()=>{state[key]=i+1;reach(qn);buildScale(elId,key,qn);updateProgress();};
    el.appendChild(b);
  });
}
function buildNps(){
  const el=document.getElementById("s2"); el.innerHTML="";
  for(let i=0;i<=10;i++){
    const b=document.createElement("button"); b.type="button"; b.textContent=i;
    if(state.q2===i)b.classList.add("on");
    b.onclick=()=>{state.q2=i;reach(2);buildNps();updateProgress();};
    el.appendChild(b);
  }
  el.className="nps"+(state.q2===null?"":(state.q2<=6?" det":(state.q2<=8?" pas":" pro")));
}
function buildChips(){
  const el=document.getElementById("s5"); el.innerHTML="";
  T.q5opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=o;
    if(state.q5.includes(i))b.classList.add("on");
    b.onclick=()=>{ const p=state.q5.indexOf(i); if(p>=0)state.q5.splice(p,1); else state.q5.push(i); reach(5); buildChips(); };
    el.appendChild(b);
  });
}
function updateProgress(){
  const done=["q1","q2","q3","q4"].filter(k=>state[k]!==null).length;
  document.getElementById("prog").style.width=(done/4*100)+"%";
}
function render(){
  const set=(id,v)=>{document.getElementById(id).textContent=v;};
  set("t-welcome",T.welcome);set("t-title",T.title);set("t-intro",T.intro);set("t-meta",T.meta);
  set("q1",T.q1);set("s1lo",T.q1lo);set("s1hi",T.q1hi);
  set("q2",T.q2);set("s2lo",T.q2lo);set("s2hi",T.q2hi);
  set("q3",T.q3);set("s3lo",T.q3lo);set("s3hi",T.q3hi);
  set("q4",T.q4);set("s4lo",T.q4lo);set("s4hi",T.q4hi);
  set("q5",T.q5);set("q5opt",T.q5opt);
  set("q6",T.q6);set("q6opt",T.q6opt);
  set("qname",T.qname);set("qnameopt",T.qnameopt);
  document.getElementById("s6").placeholder=T.q6ph;
  document.getElementById("sname").placeholder=T.qnameph;
  document.getElementById("submitBtn").textContent=T.submit;
  document.getElementById("foot").textContent=T.brand;
  document.title=T.htmltitle;
  document.documentElement.lang=LANG;
  buildScale("s1","q1",1);buildScale("s3","q3",3);buildScale("s4","q4",4);
  buildNps();buildChips();updateProgress();
}

document.getElementById("s6").addEventListener("input",()=>reach(6));
document.getElementById("sname").addEventListener("input",()=>reach(6));

function submit(){
  const err=document.getElementById("err");
  if(["q1","q2","q3","q4"].some(k=>state[k]===null)){
    err.textContent=T.reqmsg;
    document.querySelector(".q").scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  err.textContent="";
  state.q6=document.getElementById("s6").value.trim();
  state.name=document.getElementById("sname").value.trim();
  completed=true;
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent=T.sending;
  post({event:"complete",lastQuestion:6,q1:state.q1,q2:state.q2,q3:state.q3,q4:state.q4,q5:state.q5.map(i=>T.q5opts[i]),q6:state.q6,name:state.name});
  const ta=document.getElementById("thanks-area");
  ta.innerHTML='<div class="thanks"><div class="check">✓</div><h2>'+T.thankTitle+'</h2><p>'+T.thankText+'</p></div>';
  document.getElementById("form-area").hidden=true; ta.hidden=false;
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("submitBtn").onclick=submit;

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden" && !completed && !abandonSent && maxReached>0){ abandonSent=true; beacon({event:"abandon",lastQuestion:maxReached}); }
});
window.addEventListener("pagehide",()=>{
  if(!completed && !abandonSent && maxReached>0){ abandonSent=true; beacon({event:"abandon",lastQuestion:maxReached}); }
});

render();
post({event:"start",lastQuestion:0});
</script>

</body>
</html>
